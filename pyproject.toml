[project]
name = "content-campaign-agent"
version = "0.1.0"
description = "Budget-aware asynchronous content planning agent with DeepSeek"
requires-python = ">=3.12"
dependencies = [
    "langfuse>=5.0.4,<6",
    "openai>=1.80",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.8,<3",
]

[project.scripts]
campaign-agent = "content_campaign_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content_campaign_agent"]

[tool.hatch.build.targets.wheel.force-include]
data = "content_campaign_agent/data"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
